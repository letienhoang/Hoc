name: .NET CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # H4-03 archives the supported historical consumer baseline by SHA.
          fetch-depth: 0

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify SDK
        run: dotnet --version

      - name: Consumer validator self-tests
        shell: pwsh
        run: ./scripts/productization/test-verify-consumer.ps1

      - name: Admin module starter self-tests
        shell: pwsh
        run: ./scripts/productization/test-new-admin-module.ps1

      - name: Consumer bootstrap self-tests
        shell: pwsh
        run: ./scripts/productization/test-new-consumer.ps1

      # Two existing project files include these ignored paths with CopyToOutputDirectory=Always.
      # Use secret-free placeholders solely to satisfy clean-runner MSBuild item copies.
      - name: Prepare empty local config placeholders
        shell: pwsh
        run: |
          @(
            'src/Hoc.DbMigrator/appsettings.secrets.json'
            'test/Hoc.HttpApi.Client.ConsoleTestApp/appsettings.secrets.json'
          ) | ForEach-Object { Set-Content -Path $_ -Value '{}' -Encoding utf8 }

      # Web TestServer renders ABP bundles; generated wwwroot/libs is intentionally ignored.
      - name: Install Node.js for ABP client assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate ABP client libraries
        shell: pwsh
        working-directory: src/Hoc.Web
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
          dotnet tool install Volo.Abp.Cli --tool-path "$env:RUNNER_TEMP/abp-cli" --version 10.7.0
          & "$env:RUNNER_TEMP/abp-cli/abp.exe" install-libs
          if (-not (Test-Path "wwwroot/libs/abp/core/abp.css")) {
            throw "ABP static library installation did not produce abp.css."
          }

      - name: Restore solution
        run: dotnet restore Hoc.slnx -m:1 /nr:false

      - name: Build solution (Release)
        run: dotnet build Hoc.slnx --configuration Release --no-restore -m:1 /nr:false

      - name: Domain tests
        run: dotnet test test/Hoc.Domain.Tests/Hoc.Domain.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=domain.trx' -m:1 /nr:false

      - name: Application tests
        run: dotnet test test/Hoc.Application.Tests/Hoc.Application.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=application.trx' -m:1 /nr:false

      - name: EF Core SQLite tests
        run: dotnet test test/Hoc.EntityFrameworkCore.Tests/Hoc.EntityFrameworkCore.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=efcore.trx' -m:1 /nr:false

      - name: Web TestServer tests
        run: dotnet test test/Hoc.Web.Tests/Hoc.Web.Tests.csproj --configuration Release --no-build --no-restore --logger 'trx;LogFileName=web.trx' -m:1 /nr:false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-reports
          path: test/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14
